<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sevora Hero Section</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Lora:wght@500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./Hero.css" />
    </head>
    <body>
        <!--
          Homepage opening section (hero) under navbar:
          - Left column: headline, body copy, CTAs, stats
          - Right column: portrait + availability card overlay
          - Partner row below panel
        -->
        <main>
            <section class="hero" aria-labelledby="hero-title">
                <div class="hero__panel">
                    <div class="hero__content">
                        <p class="hero__eyebrow">Brand &amp; Product Design Studio</p>

                        <h1 id="hero-title" class="hero__title">
                            Craft better brands, <span class="muted">faster</span>
                        </h1>

                        <p class="hero__description">
                            I design refined brands, websites, and interfaces for
                            ambitious founders and creative teams.
                        </p>

                        <div class="hero__actions" role="group" aria-label="Primary actions">
                            <a class="button button--primary" href="/projects"
                                >View projects</a
                            >
                            <a class="button button--secondary" href="/contact"
                                >Get in touch</a
                            >
                        </div>

                        <dl class="hero__stats" aria-label="Studio highlights">
                            <div class="stat">
                                <dt>30+</dt>
                                <dd>Projects completed</dd>
                            </div>
                            <div class="stat">
                                <dt>8yr</dt>
                                <dd>Experience</dd>
                            </div>
                            <div class="stat">
                                <dt>40+</dt>
                                <dd>Happy clients</dd>
                            </div>
                        </dl>
                    </div>

                    <figure class="hero__media">
                        <img
                            src="https://framerusercontent.com/images/3Wbfg1JRGAb4TRMMz69WlQMTe8.png"
                            alt="Monochrome portrait"
                        />

                        <figcaption class="availability-card">
                            <p class="availability-card__label">Select project</p>
                            <h2 class="availability-card__title">
                                Available for projects
                            </h2>
                            <p class="availability-card__text">
                                Open to select collaborations for brand systems and
                                digital experiences.
                            </p>
                            <a
                                class="availability-card__link"
                                href="/contact"
                                aria-label="Get in touch"
                                >&#8599;</a
                            >
                        </figcaption>
                    </figure>
                </div>

                <div class="partners" aria-label="Partner brands">
                    <span>Codify</span>
                    <span>Flowboard</span>
                    <span>Agentify</span>
                    <span>TodoFusion</span>
                    <span>Identify</span>
                    <span>Nexus AI</span>
                    <span>Landify</span>
                </div>
            </section>
        </main>
    </body>
</html>
